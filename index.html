.ribbon{position:absolute;top:14px;left:-34px;width:130px;transform:rotate(-45deg);background:var(--hot);text-align:center;font-size:10px;font-weight:800;padding:3px 0;z-index:2}

const okUrl=u=>/^https:\/\/[^\s"'<>]+$/i.test(u),waNum=()=>(cfg('whatsapp')||'').replace(/\D/g,''),waLink=(t='Hi ZERVO AUTOCARE, I need help.')=>'https://wa.me/'+waNum()+'?text='+encodeURIComponent(t);
const socialHTML=(c='w-6 h-6')=>SOC.filter(s=>okUrl(cfg(s[1]))).map(s=>`<a href="${esc(cfg(s[1]))}" target="_blank" rel="noopener noreferrer" aria-label="${s[2]}">${ico(s[0],c)}</a>`).join('')+(waNum()?`<a href="${esc(waLink())}" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">${ico('message-circle',c)}</a>`:'');
const cslugs=()=>cfg('combo_slugs').split(',').map(s=>s.trim()).filter(Boolean);
const comboP=()=>cslugs().map(s=>P.find(p=>p.slug==s&&p.active)).filter(Boolean);
const cpct=()=>+cfg('combo_pct',0)||0;
const expired=()=>{const t=Date.parse(cfg('offer_ends'));return !!t&&t<=Date.now()};
const comboOn=()=>cfg('combo_on')=='true'&&cpct()>0&&!expired()&&comboP().length>0&&comboP().length==cslugs().length;
const cartItems=()=>Object.entries(CART).map(([id,q])=>({p:get(id),q:Math.min(99,Math.max(0,Math.floor(nn(q))))})).filter(x=>x.p&&x.p.active&&x.q>0);
const cnt=()=>cartItems().reduce((a,x)=>a+x.q,0);
const sub=()=>cartItems().reduce((a,x)=>a+x.p.price*x.q,0);
const free=()=>cartItems().reduce((a,x)=>a+(x.p.offer=='bogo'?x.q:0),0);
const disc=()=>{if(!comboOn())return 0;const it=cartItems(),cs=comboP();if(!cs.every(p=>it.some(x=>x.p.id==p.id)))return 0;return +(it.filter(x=>cs.some(p=>p.id==x.p.id)).reduce((a,x)=>a+x.p.price*x.q,0)*cpct()/100).toFixed(2)};
const left=()=>{const t=Date.parse(cfg('offer_ends'));return t?Math.max(0,Math.floor((t-Date.now())/1000)):0};
const tm=()=>{const s=left();return String(Math.floor(s/3600)).padStart(2,'0')+'h : '+String(Math.floor(s%3600/60)).padStart(2,'0')+'m : '+String(s%60).padStart(2,'0')+'s'};

async function loadAll(){
 const q=[sb.from('products').select('*').order('sort').order('created_at'),sb.from('reviews').select('*').order('created_at',{ascending:false}),sb.from('site_settings').select('*')];
 if(ME)q.push(sb.from('orders').select('*').order('created_at',{ascending:false}));
 if(isStaff())q.push(sb.from('profiles').select('*').order('created_at'));
 const r=await Promise.all(q),bad=r.find(x=>x.error);if(bad)throw bad.error;
 P=r[0].data.map(mapP);RV=r[1].data;ST={};r[2].data.forEach(x=>ST[x.key]=x.value);OD=ME?r[3].data:[];US=isStaff()?r[4].data:[];
 for(const k in CART)if(!P.some(p=>p.id==k&&p.active))delete CART[k];saveCart()}
async function loadMe(){ME=null;const{data:{session}}=await sb.auth.getSession();if(!session)return;
 const{data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(error)throw error;if(!data)return;
 if(data.status!='active'){await sb.auth.signOut();S.msg='This account is blocked. Please contact support.';return}ME=data}
async function db(fn,ok){try{const r=await fn();if(r&&r.error)throw r.error;await loadAll();render();if(ok)toast(ok)}catch(e){toast(fail(e),4500)}}
const sig=()=>JSON.stringify([P.map(p=>p.raw),RV,ST,OD.length,US.length]);
let rf=0;async function refresh(){const n=++rf,a=sig();try{await loadAll()}catch(e){return}
 if(n==rf&&sig()!=a&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')&&$('#modal').style.display=='none')render()}

/* ---------- navigation ---------- */
const navItems=[['home','Home','house'],['products','Products','layout-grid'],['offers','Offers','badge-percent'],['account','Account','user']];
const TABS=['home','products','offers','cart','account','signin','help','orders','tracking','admin'],GROUP={signin:'account',orders:'account',tracking:'account',admin:'account'};
const rep=t=>location.replace('#'+t);
function route(){let t=location.hash.slice(1);if(!TABS.includes(t))t='home';
 if(['account','orders','tracking','admin'].includes(t)&&!ME){S.next=t;return rep('signin')}
 if(t=='admin'&&!isStaff()){toast('Admins only.');return rep('account')}
 if(t=='signin'&&ME&&!S.recovery)return rep('account');
 S.tab=t;drawer(0);mclose();render();scrollTo(0,0);if(t!='signin')refresh()}

 $('#badge').textContent=cnt();$('#signbtn').textContent=ME?ME.name.split(' ')[0]:'Sign In';const g=GROUP[S.tab]||S.tab;
 $('#tabs').innerHTML=navItems.map(n=>`<button class="tab flex flex-col items-center py-2 gap-1 ${g==n[0]?'on':''}" onclick="go('${n[0]}')">${ico(n[2],'w-6 h-6')}${n[1]}</button>`).join('');

function drawer(o){$('#drawer').classList.toggle('open',!!o);$('#scrim').classList.toggle('hidden',!o)}
function toast(m,ms=2400){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity=0,ms)}
function modal(h){const m=$('#modal');m.innerHTML=h;m.style.display='grid';lucide.createIcons()}

function ask(msg,fn,no){window._cf=fn;window._cc=no;modal(`<div class="glass p-5 max-w-sm w-full" style="background:#111"><p>${msg}</p><div class="flex gap-3 mt-5 justify-end"><button class="ghost" onclick="mclose();window._cc&&_cc()">Cancel</button><button class="btn" onclick="mclose();_cf()">Confirm</button></div></div>`)}

/* ---------- shop actions ---------- */
function add(id){const p=get(id);if(!p||!p.active)return;const have=CART[id]||0;if(p.stock<(have+1)*(p.offer=='bogo'?2:1))return toast(p.stock>0?'Only '+p.stock+' in stock.':'Sold out.');CART[id]=have+1;saveCart();$('#badge').textContent=cnt();toast(p.name+' added to cart')}
function chg(id,d){const p=get(id);if(!CART[id]||!p)return;const n=CART[id]+d;if(n<1)delete CART[id];else{if(d>0&&p.stock<n*(p.offer=='bogo'?2:1))return toast('Only '+p.stock+' in stock.');CART[id]=Math.min(99,n)}saveCart();render()}
function del(id){delete CART[id];saveCart();render()}
function comboAdd(){const cs=comboP();cs.forEach(p=>{if(!CART[p.id])add(p.id)});if(cs.every(p=>CART[p.id]))toast('Combo added: '+cpct()+'% off in your cart.')}
function checkout(){if(!ME){S.next='cart';toast('Sign in to place an order.');return go('signin')}if(!cartItems().length)return;
 let sv={};try{sv=JSON.parse(localStorage.getItem('zervo:ship'))||{}}catch(e){}
 const f=(l,x)=>`<label class="block text-sm text-white/70 mt-3">${l}${x}</label>`;
 modal(`<div class="glass p-5 w-full max-w-md" style="background:#111;max-height:92vh;overflow-y:auto"><h2 class="text-xl font-extrabold">Delivery details</h2><p class="text-sm text-white/60 mt-1">Your order is saved here and sent to us on WhatsApp. We confirm it there and arrange payment and delivery.</p>
 ${f('Full name',`<input id="co-name" class="field mt-1" maxlength="60" value="${esc(sv.name||ME.name)}" autocomplete="name">`)}${f('Phone / WhatsApp number',`<input id="co-phone" inputmode="tel" class="field mt-1" maxlength="16" value="${esc(sv.phone||'')}" autocomplete="tel">`)}${f('Full address',`<textarea id="co-addr" rows="3" maxlength="300" class="field mt-1" autocomplete="street-address">${esc(sv.address||'')}</textarea>`)}${f('Pincode',`<input id="co-pin" inputmode="numeric" maxlength="10" class="field mt-1" value="${esc(sv.pin||'')}">`)}${f('Note (optional)',`<input id="co-note" class="field mt-1" maxlength="200">`)}
 <div class="flex gap-3 mt-5 justify-end"><button class="ghost" onclick="mclose()">Cancel</button><button class="btn" id="co-go" onclick="placeOrder()">Place order</button></div></div>`)}
async function placeOrder(){const v=k=>$('#co-'+k).value.trim(),name=v('name'),phone=v('phone').replace(/\D/g,''),addr=v('addr'),pin=v('pin'),note=v('note');
 if(name.length<2)return toast('Enter your name.');if(phone.length<10||phone.length>15)return toast('Enter a valid phone number.');if(addr.length<10)return toast('Enter your full delivery address.');
 const it=cartItems();if(!it.length)return mclose();const b=$('#co-go');b.disabled=true;
 try{const{data,error}=await sb.rpc('place_order',{p_items:it.map(x=>({id:x.p.id,qty:x.q})),p_info:{name,phone,address:addr,pincode:pin,note}});if(error)throw error;
  try{localStorage.setItem('zervo:ship',JSON.stringify({name,phone,address:addr,pin}))}catch(e){}
  CART={};saveCart();await loadAll();render();
  const link=waNum()?waOrderLink(data):'';
  modal(`<div class="glass p-5 max-w-sm w-full text-center" style="background:#111"><h2 class="text-xl font-extrabold">Order #${esc(data.code)} saved</h2><p class="text-white/70 text-sm my-3">${link?'Tap the button to send your order to us on WhatsApp. We will confirm it there.':'We have your order and will contact you on '+esc(phone)+' to confirm.'}</p>${link?`<a class="btn w-full" href="${esc(link)}" target="_blank" rel="noopener noreferrer">${ico('message-circle')} Send order on WhatsApp</a>`:''}<button class="ghost w-full mt-3" onclick="mclose();go('orders')">View my orders</button></div>`)}
 catch(e){toast(fail(e,'Could not place the order. Please try again.'),4500);b.disabled=false;try{await loadAll();render()}catch(_){}}}
function pickPhoto(inp){const f=inp.files[0];S.photo=null;if(!f)return;if(!f.type.startsWith('image/'))return toast('Please choose an image file.');
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,im.width*s);c.height=Math.max(1,im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{S.photo=b;$('#ptxt').textContent=f.name},'image/jpeg',.78)};im.onerror=()=>toast('Could not read that image.');im.src=r.result};r.readAsDataURL(f)}
async function addRev(){if(!ME){S.next='home';toast('Sign in to post a review.');return go('signin')}const t=$('#rtext').value.trim();if(t.length<3)return toast('Write a few words about your experience first.');
 const b=$('#rbtn');b.disabled=true;
 try{let url=null;if(S.photo){const path=ME.id+'/'+Date.now()+'.jpg',up=await sb.storage.from('review-photos').upload(path,S.photo,{contentType:'image/jpeg'});if(up.error)throw up.error;url=sb.storage.from('review-photos').getPublicUrl(path).data.publicUrl}
  const r=await sb.from('reviews').insert({user_id:ME.id,name:ME.name,body:t.slice(0,500),photo_url:url,rating:+$('#rrate').value||5});if(r.error)throw r.error;S.photo=null;await loadAll();render();toast('Review posted. Thanks for sharing.')}
 catch(e){toast(fail(e,'Could not post your review. Please try again.'),4000);b.disabled=false}}

/* ---------- auth ---------- */
const SAFE=/^(Enter |Please sign in|Too many orders|Only \d+ of |.{1,60} is sold out$|A product in your cart|Cart is empty|Invalid cart|Invalid details|Invalid quantity|Duplicate item|Use a JPG|Image must be|Only a Super Admin|At least one active Super Admin|You can)/;
function fail(e,d){console.error(e);const m=String(e&&e.message||'');return SAFE.test(m)?m:(d||'Something went wrong. Please try again.')}
function authMsg(e,up){console.error(e);const m=String(e&&e.message||'');if(/invalid login/i.test(m))return 'Incorrect email or password.';if(/not confirmed/i.test(m))return 'Please confirm your email first, then sign in.';if(e&&e.status==429||/rate limit|too many/i.test(m))return 'Too many attempts. Please wait a minute and try again.';if(up&&/password/i.test(m))return 'Choose a stronger password (at least 8 characters).';return up?'Could not create the account. Check your details and try again.':'Could not sign in. Please try again.'}
const okMail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
async function signIn(){const E=m=>{$('#err').textContent=m},up=S.mode=='up',email=$('#em2').value.trim().toLowerCase(),pw=$('#pw').value;
 if(!email||!pw)return E('Enter your email and password.');if(!okMail(email))return E('Enter a valid email address.');
 const nm=up?$('#nm').value.trim():'';if(up&&nm.length<2)return E('Enter your full name.');if(up&&pw.length<8)return E('Password must be at least 8 characters.');
 const b=$('#sbtn');b.disabled=true;E('');
 try{if(up){const{data,error}=await sb.auth.signUp({email,password:pw,options:{data:{name:nm.slice(0,40)}}});if(error)return E(authMsg(error,1));
   if(!data.session){S.mode='in';render();return toast('Account created. Check your email to confirm it, then sign in.',6000)}}
  else{const{error}=await sb.auth.signInWithPassword({email,password:pw});if(error)return E(authMsg(error,0))}
  await loadMe();if(!ME)return E(S.msg||'Could not load your account.');await loadAll();S.msg='';const n=S.next;S.next='';S.mode='in';go(n&&n!='signin'?n:'account');toast('Welcome, '+ME.name.split(' ')[0])}
 catch(e){E(authMsg(e,up))}finally{const x=$('#sbtn');if(x)x.disabled=false}}
function authBtn(){go(ME?'account':'signin')}
async function signOut(){ME=null;OD=[];US=[];S.next='';S.mode='in';try{await sb.auth.signOut();await loadAll()}catch(e){}go('signin');toast('Signed out.')}
async function forgot(){const e=$('#em2').value.trim().toLowerCase();if(!okMail(e))return $('#err').textContent='Enter your email above first.';
 const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});if(error)console.error(error);toast('If that account exists, a reset link was sent to your email.',4500)}
async function setNewPw(){const pw=$('#np').value;if(pw.length<8)return $('#err').textContent='Password must be at least 8 characters.';
 const{error}=await sb.auth.updateUser({password:pw});if(error){console.error(error);return $('#err').textContent='Could not update the password. Choose a stronger one (8+ characters) and try again.'}S.recovery=false;await loadMe();await loadAll();go('account');toast('Password updated.')}

async function pSave(id){const v=k=>$('#pf-'+k),name=v('name').value.trim(),price=parseFloat(v('price').value),stock=parseInt(v('stock').value,10),off=v('off').value,pct=parseInt(v('pct').value,10)||0;
 if(!name)return toast('Enter a product name.');if(!(price>=0))return toast('Enter a valid price.');if(!(stock>=0))return toast('Enter a valid stock number.');if(off=='pct'&&(pct<1||pct>90))return toast('Offer % must be between 1 and 90.');
 const row={name,full_name:v('full').value.trim()||name,category:v('cat').value.trim()||'Polish',price,stock,offer_type:off,offer_pct:off=='pct'?pct:0,description:v('desc').value.trim(),features:v('feat').value.split('\n').map(s=>s.trim()).filter(Boolean),active:v('act').checked},b=$('#pf-save');b.disabled=true;
 try{const f=v('img').files[0];if(f){if(!/^image\/(jpeg|png|webp)$/.test(f.type))throw new Error('Use a JPG, PNG or WebP image.');if(f.size>5*1024*1024)throw new Error('Image must be under 5 MB.');
   const path=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+f.type.split('/')[1],up=await sb.storage.from('product-images').upload(path,f,{contentType:f.type});if(up.error)throw up.error;row.image_url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}
  if(id){const r=await sb.from('products').update(row).eq('id',id);if(r.error)throw r.error}
  else{row.slug=(name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item')+'-'+Math.random().toString(36).slice(2,6);row.sort=P.length+1;const r=await sb.from('products').insert(row);if(r.error)throw r.error}
  mclose();await loadAll();render();toast('Product saved.')}
 catch(e){toast(fail(e,'Could not save the product. Please try again.'),4500);b.disabled=false}}
function rForm(id){const r=RV.find(x=>x.id==id);if(!r)return;modal(`<div class="glass p-5 w-full max-w-md" style="background:#111"><h2 class="text-xl font-extrabold">Edit review</h2><label class="block text-sm text-white/70 mt-3">Name<input id="rf-name" class="field mt-1" maxlength="60" value="${esc(r.name)}"></label><label class="block text-sm text-white/70 mt-3">Review<textarea id="rf-body" rows="4" maxlength="500" class="field mt-1">${esc(r.body)}</textarea></label><label class="block text-sm text-white/70 mt-3">Rating<select id="rf-rate" class="field mt-1">${[5,4,3,2,1].map(n=>`<option ${r.rating==n?'selected':''}>${n}</option>`).join('')}</select></label><div class="flex gap-3 mt-5 justify-end"><button class="ghost" onclick="mclose()">Cancel</button><button class="btn" data-fn="rSave" data-id="${esc(id)}">Save</button></div></div>`)}

const rSet=(id,st)=>db(()=>sb.from('reviews').update({status:st}).eq('id',id),st=='blocked'?'Review blocked. It is hidden from the site.':'Review restored.');
